# ==========================================
# 项目基本信息配置
# ==========================================

# 项目名称（包名），在 Dart 代码中通过 import 'package:memorydemo/...' 引用
name: memorydemo

# 项目描述，简要说明项目用途
description: A new Flutter project.

# 防止包被意外发布到 pub.dev
# 对于私有应用项目，保留 'none' 即可
# 如果要发布到 pub.dev，删除此行
publish_to: 'none'

# ==========================================
# 版本号配置
# ==========================================
# 版本号格式：主版本号.次版本号.修订号+构建号
# 例如 1.0.0+1 表示版本名 1.0.0，构建号 1
# - Android: versionName 使用 build-name，versionCode 使用 build-number
# - iOS: CFBundleShortVersionString 使用 build-name，CFBundleVersion 使用 build-number
# 构建时可通过 --build-name 和 --build-number 参数覆盖
version: 1.0.0+1

# ==========================================
# Dart SDK 环境约束
# ==========================================
# 指定 Dart SDK 版本范围，确保项目兼容性
# 当前配置：SDK 版本 >= 2.16.1 且 < 4.0.0
environment:
  sdk: ">=2.16.1 <4.0.0"

# ==========================================
# 项目运行时依赖
# ==========================================
# 这些依赖会被打包到最终应用中
# 升级依赖：flutter pub upgrade --major-versions
# 查看可更新的依赖：flutter pub outdated
dependencies:
  # Flutter SDK 核心依赖
  flutter:
    sdk: flutter

  # iOS 风格图标库，通过 CupertinoIcons 类使用   1
  cupertino_icons: ^1.0.2

  # GetX 状态管理库，提供状态管理、路由管理、依赖注入等功能    1
  get: ^4.6.5

  # Floor 数据库 ORM 框架，基于 SQLite，类似于 Room   1
  floor: ^1.3.0

  # GetX 生态的轻量级本地存储，基于 SharedPreferences 封装  1
  get_storage: ^2.0.3

  # 自适应对话框，在 Android 和 iOS 上自动匹配各自的设计风格
  adaptive_dialog: ^1.6.3

  # 音频播放库，支持播放本地和网络音频文件
  audioplayers: ^6.7.1

  # 获取设备常用目录路径（如临时目录、文档目录等）
  path_provider: ^2.0.11

  # Dio 网络请求库，功能强大的 HTTP 客户端，支持拦截器、取消请求等
  dio: ^4.0.6

  # SQLite 数据库操作插件，Flutter 官方推荐的本地数据库方案
  sqflite: ^2.0.2+1

  # 保持屏幕常亮，防止屏幕自动休眠
  wakelock: ^0.6.1+2

  # 底部选择器，用于日期、时间等底部弹出选择
  bottom_picker: ^1.9.1

  # 数据加密库，支持 AES、Salsa20 等加密算法
  encrypt: ^5.0.1

  # 归档文件处理，支持 zip、tar 等格式的压缩和解压
  archive: ^3.3.0

  # 底部弹层组件
  bottom_sheet: ^3.0.0

  # 模态底部弹层，支持多种展示效果
  modal_bottom_sheet: ^2.1.2

  # 加密算法库，支持 SHA、HMAC、AES、X25519 等
  cryptography: ^2.0.5

  # JSON 序列化库，用于解析插件配置
  json_annotation: ^4.8.1

  # 可展开的底部面板组件
  expandable_bottom_sheet: ^1.1.1+1

  # 可滑动底部面板，类似地图应用的底部抽屉效果
  sliding_sheet: ^0.5.2

  # 虚线绘制组件，用于绘制各种虚线效果
  dotted_line: ^3.1.0

# ==========================================
# 开发环境依赖
# ==========================================
# 这些依赖仅在开发/测试时使用，不会打包到最终应用中
dev_dependencies:
  # Flutter 测试框架
  flutter_test:
    sdk: flutter

  # Flutter 官方推荐的代码规范检查工具
  # 在 analysis_options.yaml 中配置具体规则
  flutter_lints: ^1.0.0

  # Floor 数据库的代码生成器，配合 build_runner 使用
  floor_generator: ^1.3.0

  # 代码构建工具，用于运行各种代码生成器（如 Floor、json_serializable 等）
  # 使用命令：flutter pub run build_runner build
  build_runner: ^2.1.2

  # JSON 序列化代码生成器
  json_serializable: ^6.7.0

  # 自动调整文本大小的组件，让文本在有限空间内自动缩放
  auto_size_text: ^3.0.0

# ==========================================
# Flutter 特定配置
# ==========================================
flutter:

  # 启用 Material Design 图标，确保 Icons 类可用
  uses-material-design: true

  # ---------- 静态资源配置 ----------
  # 所有需要打包到应用中的资源文件都需要在此声明
  assets:
    # 首页相关图片资源
    - assets/img/home/book1.png
    - assets/img/home/cup.png
    - assets/img/home/head.png

    # 词典数据库文件（本地数据库）
    - assets/dict.db
    - assets/dict.db1

    # 其他图片资源
    - assets/img/chicken.png

  # ---------- 自定义字体配置（示例） ----------
  # 如需添加自定义字体，取消下面注释并修改对应路径
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
